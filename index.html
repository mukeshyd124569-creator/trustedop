<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="google-site-verification" content="xk0pQgnxmDlkQy_M2Ci7hSbOcmZEPpEYCOShTHA62UM" />

  <link rel="canonical" href="https://trustedop.in/" />

  <meta
    name="description"
    content="Trusted OP - Official website of Trusted OP. Fast service, secure platform and easy access."
  >

  <meta name="robots" content="index, follow">

  <title>Trusted OP – Official Website</title>

  <!-- Google Site Name -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Trusted OP",
    "alternateName": [
      "TrustedOP",
      "Trusted OP Official"
    ],
    "url": "https://trustedop.in/"
  }
  </script>

  <!-- Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Trusted OP",
    "url": "https://trustedop.in/",
    "logo": "https://trustedop.in/IMG_20260707_191158.png"
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #24104a 0%, #0b0715 45%, #050509 100%);
      color: white;
      text-align: center;
    }

    .hero {
      padding: 70px 20px 35px;
    }

    .logo {
      width: 130px;
      height: 130px;
      margin: auto;
      border-radius: 24px;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 30px rgba(255, 40, 40, 0.55);
      border: 2px solid rgba(255,255,255,0.15);
    }

    h1 {
      margin-top: 25px;
      font-size: 42px;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 15px #00eaff;
    }

    .subtitle {
      margin-top: 12px;
      color: #cfcfcf;
      font-size: 17px;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: auto;
    }

    .card {
      margin: 20px 0;
      padding: 25px 18px;
      border-radius: 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    .card h2 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    .card p {
      color: #c8c8c8;
      line-height: 1.6;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 14px 0;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(90deg, #7b2cff, #00bfff);
      box-shadow: 0 0 18px rgba(0,191,255,0.35);
      transition: 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .download {
      background: linear-gradient(90deg, #ff1744, #ff6d00);
      box-shadow: 0 0 20px rgba(255,70,0,0.4);
    }

    .instagram {
      background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
    }

    .join {
      background: linear-gradient(90deg, #00c853, #64dd17);
      box-shadow: 0 0 20px rgba(0,255,80,0.3);
    }

    .withdrawal {
      background: linear-gradient(90deg, #ff1744, #ff9100);
      box-shadow: 0 0 20px rgba(255,70,0,0.35);
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .feature {
      padding: 18px 8px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .feature strong {
      display: block;
      margin-top: 8px;
    }

    .withdrawal-text {
      margin-top: 10px;
      font-size: 16px;
    }

    .bonus {
      color: #ffd54f !important;
      font-weight: bold;
    }

    footer {
      padding: 35px 10px 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <section class="hero">

    <img
      class="logo"
      src="./IMG_20260707_191158.png"
      alt="TRUSTED OP Logo"
    >

    <h1>TRUSTED OP</h1>

    <p class="subtitle">
      Welcome to the official Trusted OP website
    </p>
